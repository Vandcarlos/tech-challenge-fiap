name: Create Auto PR

on:
  workflow_call:
    inputs:
      head-branch:
        required: true
        type: string
      base-branch:
        required: true
        type: string
      pr-title:
        required: true
        type: string
      pr-body:
        required: true
        type: string

jobs:
  create-pr:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create Pull Request with GH CLI
        shell: bash
        run: |
          PR_EXISTS=$(gh pr list --head "${{ inputs.head-branch }}" --base "${{ inputs.base-branch }}" --state open --json number -q '.[0].number')

          if [ -z "$PR_EXISTS" ]; then
            echo "Nenhum PR aberto encontrado. Criando um novo..."
            # Usamos as variáveis de ambiente aqui para evitar que o Bash interprete o conteúdo
            gh pr create \
              --head "$HEAD_BRANCH" \
              --base "$BASE_BRANCH" \
              --title "$PR_TITLE" \
              --body "$PR_BODY"
          else
            echo "PR #${PR_EXISTS} já está aberto."
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_BRANCH: ${{ inputs.head-branch }}
          BASE_BRANCH: ${{ inputs.base-branch }}
          PR_TITLE: ${{ inputs.pr-title }}
          PR_BODY: ${{ inputs.pr-body }}