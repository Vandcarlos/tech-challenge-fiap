name: Auto PR to Dev

on:
  push:
    branches:
      - 'feature/**'
      - 'chore/**'
      - 'bugfix/**'

jobs:
  run-ci:
    uses: ./.github/workflows/reusable-ci.yml
    with:
      min-coverage: '75'

  create-pr:
    needs: run-ci
    permissions:
      contents: write
      pull-requests: write
    uses: ./.github/workflows/reusable-create-pr.yml
    with:
      head-branch: ${{ github.ref_name }}
      base-branch: dev
      pr-title: 'Auto PR: ${{ github.ref_name }} → dev'
      pr-body: |
        ## Automated Pull Request
        This PR was automatically created from branch `${{ github.ref_name }}`.

        **Triggered by:** Push to `${{ github.ref_name }}`
