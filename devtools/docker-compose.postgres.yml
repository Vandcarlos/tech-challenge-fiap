services:
  postgres:
    image: postgres:15
    container_name: postgres
    env_file: .env
    environment:
      # POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/postgress-init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    networks:
      - mlops
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 30

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    entrypoint: ["/custom-setup.sh"]
    # user: root
    environment:
      PGADMIN_CONFIG_AUTHENTICATION_SOURCES: "['internal']"
      # PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
      # PGADMIN_CONFIG_LOGIN_BANNER: "'MLOps Platform'"

      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"

      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGADMIN_SERVER_JSON_FILE: "/pgadmin4/servers.json"
    volumes:
      - ./scripts/pgadmin-servers.json:/pgadmin4/servers.json:ro
      - ./scripts/pgadmin-setup.sh:/custom-setup.sh:ro
    ports:
      - "5050:80" # Acesse o pgAdmin em http://localhost:5050
    networks:
      - mlops
    depends_on:
      - postgres

volumes:
  postgres_data:
