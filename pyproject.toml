[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tech-challenge-fiap"
version = "0.1.0"
description = "FIAP Tech Challenge"
requires-python = ">=3.12"
dependencies = [
    "python-dotenv>=1.0.0",
    "mlflow==3.11.1",
]

[project.optional-dependencies]
ingest = [
    "pyspark==4.1.1",
    "kagglehub==1.0.0",
    "pandas==2.2.3",
    "openpyxl==3.1.5",
    "pandera[pyspark]==0.31.1",
    "hypothesis==6.152.4",
]

tests = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
]
notebooks = [
    "jupyter>=1.0.0",
    "jupyterlab>=4.0.0",
    "ipykernel>=6.25.0",
    "kagglehub==1.0.0",
    "pandas==2.2.3",
    "openpyxl==3.1.5",
    "matplotlib==3.10.9",
    "seaborn==0.13.2",
    "scikit-learn==1.8.0",
    "numpy==2.4.4",
    "torch==2.2.2"
]
dev = [
    "ruff>=0.0.292",
    "mypy>=1.5.0",
]

[tool.mypy]
mypy_path = "typings"
explicit_package_bases = true
ignore_missing_imports = true
package_bases = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # Pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
]

ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]
"typings/**/*.pyi" = ["F401", "F811"] # Ignora erros comuns em arquivos de stub

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src --cov-report=html --cov-report=term-missing --cov-fail-under=90 -v"
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
